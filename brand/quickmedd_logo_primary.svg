<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140" role="img" aria-label="QuickMedD logo">
  <title>QuickMedD</title>
  <rect width="520" height="140" fill="#FFFFFF"/>

  <!-- Icon: motion lines + tilted capsule with medical plus -->
  <g transform="translate(20 20)">
    <!-- speed / motion lines -->
    <g fill="#FF6B57">
      <rect x="-4" y="34" width="26" height="9" rx="4.5" transform="rotate(-45 9 38.5)"/>
      <rect x="-2" y="54" width="34" height="9" rx="4.5" transform="rotate(-45 15 58.5)"/>
      <rect x="0" y="74" width="26" height="9" rx="4.5" transform="rotate(-45 13 78.5)"/>
    </g>

    <!-- capsule -->
    <g transform="rotate(-45 60 50)">
      <rect x="30" y="26" width="60" height="48" rx="24" fill="#12A5A5"/>
      <rect x="30" y="26" width="30" height="48" rx="24" fill="#0B3B6F"/>
      <!-- split seam -->
      <rect x="58" y="26" width="4" height="48" fill="#FFFFFF"/>
      <!-- medical plus on the teal half -->
      <g fill="#FFFFFF">
        <rect x="70" y="44" width="12" height="12" rx="2"/>
        <rect x="72" y="38" width="8" height="24" rx="2"/>
        <rect x="64" y="46" width="24" height="8" rx="2"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Montserrat','Segoe UI',Arial,sans-serif" font-weight="700">
    <text x="150" y="88" font-size="58" fill="#0B3B6F" letter-spacing="-1">QuickMed</text>
    <text x="452" y="88" font-size="58" fill="#12A5A5" letter-spacing="-1" font-weight="800">D</text>
    <circle cx="503" cy="46" r="6" fill="#FF6B57"/>
  </g>
</svg>
